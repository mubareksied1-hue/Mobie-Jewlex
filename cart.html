<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cart - Jewelry</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="cart.css">
    <script src="cart.js" defer></script>
</head>

<body>

    <nav class="Navbar">

        <div class="logo">
            <div class="logo-mark" aria-label="Mobie Jewlex logo">
                <i class="fa-solid fa-crown"></i>
            </div>
            <h1>Mobie Jewlex</h1>
        </div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="product.html">Product</a></li>
            <li><a href="contact.html">Contact</a></li>
            <li class="nav-dropdown">
                <details>
                    <summary>
                        Pages
                        <i class="fa-solid fa-chevron-down"></i>
                    </summary>
                    <div class="dropdown-menu">
                        <a href="index.html">Home</a>
                        <a href="product.html">Product</a>
                        <a href="contact.html">Contact</a>
                        <a href="cart.html">Cart</a>
                        <a href="blog.html">Blog</a>
                        <a href="404.html">404</a>
                    </div>
                </details>
            </li>

            <li>
                <a href="cart.html" class="cart-link">
                    <i class="fa-solid fa-cart-shopping"></i>

                    <span id="cart-count">0</span>
                </a>
            </li>
        </ul>

        <a href="product.html" class="shop-now-btn">
            <i class="fa-solid fa-cart-shopping"></i>
        </a>

    </nav>


    <main class="cart-page">

        <section class="cart-hero">

            <div class="cart-hero-content">

                <span class="eyebrow">
                    Luxury Essentials
                </span>
                <h1>Your Cart</h1>
                <p>Review your selected jewelry and continue to checkout.</p>

            </div>

            <div class="cart-hero-image">
                <img src="image Jewelry/chatgpt.jpg" alt="Jewelry hero image">
            </div>

        </section>


        <section class="cart-layout">


            <div class="cart-items-panel">

                <div id="cart-list" class="cart-list">
                </div>

            </div>


            <aside class="cart-summary">

                <h2>Cart Summary</h2>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <strong id="cart-subtotal">$0.00</strong>
                </div>

                <div class="summary-row">
                    <span>Shipping</span>
                    <strong id="cart-shipping">Free</strong>
                </div>

                <div class="summary-row">
                    <span>Tax</span>
                    <strong id="cart-tax">$0.00</strong>
                </div>

                <div class="summary-total">
                    <span>Total</span>
                    <span id="cart-total">$0.00</span>
                </div>

                <button id="checkout-btn" class="checkout-btn">
                    CHECKOUT
                </button>

            </aside>

        </section>

    </main>

</body>
</html>
